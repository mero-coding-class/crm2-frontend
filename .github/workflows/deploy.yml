name: Deploy frontend to Jelastic

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JELASTIC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # pinned host key: ssh-keyscan against the gate fails intermittently
          echo "${{ vars.JELASTIC_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Upload dist/
        run: |
          rsync -az --delete -e "ssh -p 3022" dist/ \
            "${{ vars.JELASTIC_USER }}@${{ vars.JELASTIC_GATE }}:www/"  # ponytail: relative to the nginx user's home, which it owns